<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="description" content="Bloom-Treppe Säure-Base-Chemie: differenzierte Lernapp mit Basis- und Erweiterungsstufen.">
<meta name="theme-color" content="#F2F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F151B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Säure-Base-Chemie: Bloom-Treppe</title>
<style>
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:400;font-display:swap;src:url("fonts/atkinson-hyperlegible-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Atkinson Hyperlegible";font-style:normal;font-weight:700;font-display:swap;src:url("fonts/atkinson-hyperlegible-latin-700-normal.woff2") format("woff2")}
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:200 800;font-display:swap;src:url("fonts/bricolage-grotesque-latin-standard-normal.woff2") format("woff2-variations"),url("fonts/bricolage-grotesque-latin-standard-normal.woff2") format("woff2")}
:root{
  --paper:#F2F5F4; --paper2:#E8EEEC; --surface:#FFFFFF; --ink:#141C24; --muted:#56636E; --line:#D5DDE0;
  --ok:#1F7A47; --okbg:#E2F4EA; --bad:#B3261E; --badbg:#FCEBE8; --focus:#1F5FD1;
  --s1:#D7263D; --s2:#EE7B22; --s3:#E2B91F; --s4:#2F9A55; --s5:#2F6FDE; --s6:#6B3FA0;
  --t1:#fff; --t2:#1A1206; --t3:#1A1606; --t4:#fff; --t5:#fff; --t6:#fff;
  --spectrum:linear-gradient(90deg,var(--s1),var(--s2),var(--s3),var(--s4),var(--s5),var(--s6));
  --shadow:0 1px 2px rgba(20,28,36,.06),0 6px 20px -8px rgba(20,28,36,.14);
  --shadow-lg:0 2px 4px rgba(20,28,36,.06),0 14px 34px -12px rgba(20,28,36,.22);
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;
  --navh:0px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F151B; --paper2:#151E26; --surface:#19232C; --ink:#E7EDF1; --muted:#9BA9B4; --line:#2A3641;
    --ok:#6BCB93; --okbg:#15301F; --bad:#F2877D; --badbg:#3A1B19; --focus:#8AB0F7;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 16px 36px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F151B; --paper2:#151E26; --surface:#19232C; --ink:#E7EDF1; --muted:#9BA9B4; --line:#2A3641;
  --ok:#6BCB93; --okbg:#15301F; --bad:#F2877D; --badbg:#3A1B19; --focus:#8AB0F7;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px -10px rgba(0,0,0,.6); --shadow-lg:0 2px 4px rgba(0,0,0,.3),0 16px 36px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img,svg{max-width:100%}
code{font-size:.9em;background:var(--paper2);padding:1px 5px;border-radius:5px}

/* App-Leiste */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.appbar::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:3px;background:var(--spectrum);opacity:.9}
.appbar-in{max-width:1080px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:18px;margin:0;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;gap:4px}
.nav button{border:0;background:transparent;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:700;font-size:15px;color:var(--muted)}
.nav button:hover{color:var(--ink);background:var(--paper2)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:var(--shadow)}

.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 72px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(32px,6vw,58px);line-height:1;letter-spacing:-.025em;margin:6px 0 10px}
.lede{color:var(--muted);max-width:60ch;margin:0}

.btn{border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:700;font-size:16px;transition:transform .12s ease, box-shadow .12s ease}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn[disabled]{opacity:.38;cursor:not-allowed;box-shadow:none;transform:none}
.link{background:none;border:0;padding:6px 0;min-height:36px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px;cursor:pointer;font-weight:700;font-size:16px}

/* Themen */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:2px}
.tab{flex:none;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px 9px;min-height:52px;cursor:pointer;text-align:left;font-size:15px;font-weight:700;line-height:1.2;display:flex;flex-direction:column;gap:7px;transition:border-color .15s, box-shadow .15s}
.tab:hover{border-color:var(--ink)}
.tab[aria-current="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper);box-shadow:var(--shadow)}
.segs{display:flex;gap:3px}
.segs i{width:16px;height:5px;border-radius:3px;background:var(--line)}
.segs i.full{background:var(--c)}
.tab[aria-current="true"] .segs i:not(.full){background:color-mix(in srgb,var(--paper) 30%,transparent)}
.segs i.gap{margin-left:5px}

/* Treppe */
.stage{margin:22px 0 0;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:22px 22px 14px}
.stairs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;align-items:end;height:250px}
.step{--c:var(--s1);--t:var(--t1);position:relative;border:2.5px solid var(--c);background:color-mix(in srgb,var(--c) 9%,var(--surface));color:var(--ink);
  border-radius:12px 12px 4px 4px;cursor:pointer;text-align:left;padding:10px 10px 10px;display:flex;flex-direction:column;justify-content:flex-start;gap:2px;
  transition:transform .18s cubic-bezier(.2,.8,.3,1.2), box-shadow .18s}
.step:hover{transform:translateY(-4px);box-shadow:0 10px 18px -10px var(--c)}
.step .n{font-family:var(--display);font-weight:800;font-size:28px;line-height:1}
.step .nm{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.step .st{font-size:13px;margin-top:auto;opacity:.92}
.step .chk{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:var(--t);color:var(--c);display:grid;place-items:center;font-size:13px;font-weight:800}
.step.done,.step.skipped{background:var(--c);color:var(--t)}
.step.done{background:linear-gradient(180deg,color-mix(in srgb,#fff 14%,var(--c)),var(--c) 60%)}
.step.current{box-shadow:0 0 0 3px var(--surface),0 0 0 6px var(--c),0 12px 20px -10px var(--c);transform:translateY(-4px)}
.step:nth-child(1){height:36%;--c:var(--s1);--t:var(--t1)}
.step:nth-child(2){height:49%;--c:var(--s2);--t:var(--t2)}
.step:nth-child(3){height:62%;--c:var(--s3);--t:var(--t3)}
.step:nth-child(4){height:75%;--c:var(--s4);--t:var(--t4)}
.step:nth-child(5){height:88%;--c:var(--s5);--t:var(--t5)}
.step:nth-child(6){height:100%;--c:var(--s6);--t:var(--t6)}
.floor{height:5px;background:var(--ink);border-radius:3px;margin-top:-1px}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 0;font-size:14px;color:var(--muted)}
.zones div{padding-top:2px}
.zones b{color:var(--ink)}

/* Inhalt */
.panel{max-width:780px;margin-top:30px}
.lvlhead{position:relative;padding:18px 20px;margin-bottom:16px;border-radius:18px;background:color-mix(in srgb,var(--c,var(--ink)) 12%,var(--surface));border:1.5px solid color-mix(in srgb,var(--c,var(--ink)) 35%,transparent)}
.lvlhead h2{font-family:var(--display);font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
.lvlhead p{margin:0;color:var(--muted)}
h2.plain{font-family:var(--display);font-weight:800;font-size:clamp(26px,4vw,32px);margin:0 0 10px;letter-spacing:-.01em;line-height:1.1}
h3{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 8px}
.badge{display:inline-block;font-family:var(--body);font-size:13px;font-weight:700;border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle;background:var(--surface);border:1.5px solid currentColor;letter-spacing:0}
.progressbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:0 0 18px}
.progressbar i{display:block;height:100%;background:var(--c,var(--ink));border-radius:4px;transition:width .4s ease}

.task{background:var(--surface);border-radius:18px;padding:22px;margin:0 0 16px;box-shadow:var(--shadow)}
.task .k{font-size:13px;color:var(--muted);margin:0 0 6px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.task .q{margin:0 0 16px;white-space:pre-line;overflow-wrap:anywhere;font-size:18px}
.fig{background:var(--paper);border-radius:12px;padding:10px;margin:0 0 16px;overflow-x:auto}
.fig svg{display:block;width:100%;max-width:520px;height:auto;margin:0 auto}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--paper);border:2px solid transparent;border-radius:14px;padding:12px 14px;min-height:54px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:border-color .15s, background .15s, transform .1s}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt:active:not([disabled]){transform:scale(.99)}
.opt .l{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--surface);border:1.5px solid var(--line)}
.opt.wrong{border-color:var(--bad);background:var(--badbg);opacity:.8}
.opt.wrong span:last-child{text-decoration:line-through;text-decoration-thickness:1.5px}
.opt.wrong .l{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg);font-weight:700}
.opt.right .l{background:var(--ok);border-color:var(--ok);color:#fff}
.opt[disabled]{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numrow input{width:160px;min-height:48px;padding:10px 14px;border:2px solid var(--line);border-radius:12px;background:var(--paper);font-size:18px}
.numrow input:focus{border-color:var(--ink);outline:none}
textarea{width:100%;min-height:160px;padding:14px;border:2px solid var(--line);border-radius:14px;background:var(--paper);resize:vertical;line-height:1.5;font-size:17px}
textarea:focus{border-color:var(--ink);outline:none}
.eq{font-family:var(--display);font-weight:700;font-size:clamp(19px,3.6vw,26px);text-align:center;background:var(--paper);border-radius:12px;padding:14px;margin:0 0 14px;overflow-x:auto;white-space:nowrap}
.assign{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.assign label{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:2px solid transparent;border-radius:14px;padding:12px}
.assign label.wrong{border-color:var(--bad);background:var(--badbg)}
.assign label.right{border-color:var(--ok);background:var(--okbg)}
.assign .f{font-family:var(--display);font-weight:700;font-size:22px;text-align:center}
.assign select{width:100%;min-height:44px;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font-size:16px}
.fb{display:flex;gap:12px;align-items:flex-start;margin:14px 0 0;padding:12px 14px;border-radius:14px;font-size:16px}
.fb .ico{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:14px;margin-top:1px}
.fb.ok{background:var(--okbg)} .fb.ok .ico{background:var(--ok)}
.fb.bad{background:var(--badbg)} .fb.bad .ico{background:var(--bad)}
.fb.info{background:var(--paper2)} .fb.info .ico{background:var(--muted)}
.hint{font-size:14px;color:var(--muted);margin:8px 0 0}
.hints{margin:14px 0 0}
.hints .tip{margin:8px 0 0;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--s3) 20%,var(--surface));font-size:16px}
.crit{margin:16px 0 0;padding:16px;border-radius:14px;background:var(--paper)}
.crit p{margin:0 0 8px;font-weight:700}
.crit label{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer;min-height:40px}
.crit input{margin-top:3px;width:22px;height:22px;flex:none;accent-color:var(--ok)}
details{margin-top:14px;background:var(--paper);border-radius:14px;padding:12px 16px}
summary{cursor:pointer;font-weight:700;min-height:28px}
details .sample{margin:10px 0 0;white-space:pre-line}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
.jump{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;border:2px dashed var(--line);border-radius:16px;padding:14px 18px;margin:0 0 16px}
.jump p{margin:0;flex:1 1 260px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:18px 0}
.choice{position:relative;text-align:left;background:var(--surface);border:0;border-radius:18px;padding:20px 20px 20px;cursor:pointer;box-shadow:var(--shadow);overflow:hidden;transition:transform .15s, box-shadow .15s}
.choice::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--spectrum)}
.choice:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.choice b{display:block;font-family:var(--display);font-size:20px;margin-bottom:4px}
.choice span{color:var(--muted)}

.tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:14px 0 0}
.tcard{text-align:left;background:var(--surface);border:2px solid transparent;border-radius:18px;padding:16px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;transition:transform .15s, border-color .15s}
.tcard:hover{transform:translateY(-2px)}
.tcard[aria-current="true"]{border-color:var(--ink)}
.tcard b{font-family:var(--display);font-size:18px;line-height:1.2}
.tcard small{color:var(--muted);font-size:14px}
.tcard .segs i{flex:1;height:7px}

.sumlist{list-style:none;padding:0;margin:0 0 20px;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.sumlist li{display:flex;gap:12px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--line)}
.sumlist li:last-child{border-bottom:0}
.dot{width:16px;height:16px;border-radius:50%;flex:none;border:2.5px solid var(--c)}
.dot.full{background:var(--c)}
.sumlist .s{margin-left:auto;color:var(--muted);font-size:14px;text-align:right}
.teacher p{max-width:68ch}
.teacher textarea{min-height:320px;font-family:ui-monospace,Consolas,monospace;font-size:13px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* Feier */
.burst{position:relative;height:0}
.burst i{position:absolute;top:-6px;width:9px;height:14px;border-radius:2px;opacity:0;animation:pop 1.1s ease-out forwards}
@keyframes pop{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}

/* Mobile Leiste unten */
.bottomnav{display:none}

@media (max-width:640px){
  :root{--navh:64px}
  body{font-size:16.5px}
  .appbar-in{padding:8px 16px}
  .nav{display:none}
  .wrap{padding:14px 14px calc(var(--navh) + env(safe-area-inset-bottom,0px) + 28px)}
  .hero h1{font-size:32px;margin:2px 0 6px}
  .lede{font-size:15px}
  .hero.compact .lede{display:none}
  .tabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x mandatory;margin:14px -14px 0;padding:2px 14px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{scroll-snap-align:start;max-width:78vw}
  .stage{margin-top:12px;padding:14px 12px 10px;border-radius:18px}
  .stairs{height:150px;gap:5px}
  .step{padding:6px 4px;border-radius:9px 9px 3px 3px;align-items:center;justify-content:flex-end}
  .step .nm,.step .st{display:none}
  .step .n{font-size:22px}
  .step .chk{top:5px;right:auto;left:50%;transform:translateX(-50%);width:18px;height:18px;font-size:11px}
  .zones{font-size:13px}
  .panel{margin-top:20px}
  .lvlhead{padding:14px 16px;border-radius:16px}
  .task{padding:16px;border-radius:16px}
  .task .q{font-size:17px}
  .assign{grid-template-columns:1fr 1fr;gap:8px}
  .assign label{padding:10px}
  .assign .f{font-size:20px}
  .row .btn{flex:1 1 auto}
  .numrow input{flex:1;width:auto;min-width:0}
  .numrow .btn{flex:none}
  .jump .btn{width:100%}
  .choices{grid-template-columns:1fr}
  .tcards{grid-template-columns:1fr}
  .bottomnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--navh) + env(safe-area-inset-bottom,0px));padding:0 8px env(safe-area-inset-bottom,0px);
    background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .bottomnav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
  .bottomnav svg{width:24px;height:24px}
  .bottomnav button[aria-current="page"]{color:var(--ink)}
  .bottomnav button[aria-current="page"] svg{stroke-width:2.4}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
  .step:hover,.step.current{transform:none}
}
</style>
</head>
<body>
<header class="appbar"><div class="appbar-in">
  <button class="brand" data-act="home" aria-label="Bloom-Treppe, zur Startseite"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="20" width="6" height="10" rx="1.5" fill="#D7263D"/><rect x="9" y="15" width="6" height="15" rx="1.5" fill="#EE7B22"/><rect x="16" y="10" width="6" height="20" rx="1.5" fill="#2F9A55"/><rect x="23" y="4" width="7" height="26" rx="1.5" fill="#6B3FA0"/></svg><span>Bloom-Treppe</span></button>
  <nav class="nav" aria-label="Ansichten">
    <button data-act="home" data-nav="home">Lernen</button>
    <button data-act="summary" data-nav="summary">Mein Fortschritt</button>
    <button data-act="teacher" data-nav="teacher">Für Lehrkräfte</button>
  </nav>
</div></header>
<div class="wrap">
  <section class="hero" id="hero"><h1 id="title">Säure-Base-Chemie</h1><p class="lede" id="subtitle"></p></section>
  <div class="tabs" id="tabs" aria-label="Themen"></div>
  <div class="stage">
    <div class="stairs" id="stairs" role="list" aria-label="Die Stufen des Themas"></div>
    <div class="floor"></div>
    <div class="zones" id="zones"></div>
  </div>
  <main class="panel" id="panel" aria-live="polite"></main>

const KEY_C="saeure-base-treppe-content-v2", KEY_P="saeure-base-treppe-progress-v2";

function freshProgress(){return {tasks:{},levels:{},view:"start",topic:0,current:0,jump:false,placement:{idx:0,last:null},placementAns:null}}

/* Antwortreihenfolge pro Aufgabe fest, aber gemischt */
function order(n,seed){
  let h=2166136261; for(const ch of seed){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const a=[...Array(n).keys()];
  for(let i=n-1;i>0;i--){h=Math.imul(h^(h>>>15),2246822507)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function taskDone(t,s){ if(!s) return false; return t.type==="open" ? !!s.submitted : !!s.solved; }
function levelCount(ti,li){ const lv=content.topics[ti].levels[li]; let d=0; lv.tasks.forEach((t,k)=>{ if(taskDone(t,P.tasks[`${ti}-${li}-${k}`])) d++; }); return [d,lv.tasks.length]; }
const lvState = (ti,li)=>P.levels[`${ti}-${li}`];
function fundDone(ti){ for(let i=0;i<Math.min(F(),content.topics[ti].levels.length);i++){ if(!lvState(ti,i)) return false; } return true; }
function placementLevels(ti){ return content.topics[ti].levels.map((l,i)=>l.jump?i:-1).filter(i=>i>=0); }

/* ---------- Kopf: Themen und Treppe ---------- */
function segs(ti){
  return `<span class="segs" aria-hidden="true">${content.topics[ti].levels.slice(0,6).map((_,i)=>`<i class="${lvState(ti,i)?"full":""} ${i===F()?"gap":""}" style="--c:${col(i)}"></i>`).join("")}</span>`;
}
function renderTabs(){
  const tb=document.getElementById("tabs");
  tb.innerHTML = content.topics.map((t,i)=>`<button class="tab" data-act="topic" data-t="${i}" aria-current="${i===P.topic}" aria-label="${esc(t.name)}, ${fundDone(i)?"Basis geschafft":"Basis offen"}">${esc(t.name)}${segs(i)}</button>`).join("");
  const c=tb.querySelector('.tab[aria-current="true"]');
  if(c && tb.scrollWidth>tb.clientWidth && (c.offsetLeft<tb.scrollLeft || c.offsetLeft+c.offsetWidth>tb.scrollLeft+tb.clientWidth)) tb.scrollLeft=c.offsetLeft-14;
}
function renderStairs(){
  const lv=T().levels;
  document.getElementById("stairs").innerHTML = lv.slice(0,6).map((l,i)=>{
    const st=lvState(P.topic,i); const [d,n]=levelCount(P.topic,i);
    const cls = st==="done"?"done":st==="skipped"?"skipped":"";
    const cur = P.view==="level" && P.current===i ? "current":"";
    const label = st==="done"?"geschafft":st==="skipped"?"übersprungen":d>0?`${d} von ${n}`:"";
    return `<button class="step ${cls} ${cur}" role="listitem" data-act="level" data-i="${i}" aria-label="Stufe ${i+1}: ${esc(l.name)}${i<F()?", Basis":", Erweiterung"}${label?", "+label:""}">

  z.style.gridTemplateColumns = f<n ? `${f}fr ${n-f}fr` : "1fr";

}

/* ---------- Aufgaben ---------- */
function mcHTML(t,s,key,locked){
  const ord=order(t.options.length,key+t.q);
  return `<div class="opts" role="group">${ord.map((oi,pos)=>{
    const o=t.options[oi]; const wrong=s?.wrong?.includes(oi); const right=s?.solved && oi===t.correct;
    const dis = locked || s?.solved || wrong;
    return `<button class="opt ${wrong?"wrong":""} ${right?"right":""}" data-act="mc" data-key="${key}" data-o="${oi}" ${dis?"disabled":""}><span class="l">${L[pos]}</span><span>${esc(o)}</span></button>`;
  }).join("")}</div>`;
}
function numHTML(t,s,key,locked){
  const dis = locked || s?.solved;
  return `<div class="numrow"><label class="visually-hidden" for="n-${key}">Deine Antwort</label>
    <input id="n-${key}" inputmode="decimal" value="${esc(s?.value??"")}" ${dis?"disabled":""} placeholder="Zahl">
    ${t.unit?`<span>${esc(t.unit)}</span>`:""}
    <button class="btn" data-act="num" data-key="${key}" ${dis?"disabled":""}>Prüfen</button></div>`;
}
function assignHTML(t,s,key,locked){
  const dis = locked || s?.solved;
  return `${t.eq?`<div class="eq">${esc(t.eq)}</div>`:""}<div class="assign">${t.items.map((it,ii)=>{
    const sel=s?.sel?.[ii]; const mark = s?.checked ? (s.solved||sel===it.answer?"right":"wrong") : "";
    return `<label class="${mark}"><span class="f">${esc(it.text)}</span>
      <select data-act="sel" data-key="${key}" data-i="${ii}" ${dis?"disabled":""} aria-label="Rolle von ${esc(it.text)}">
      <option value="">wählen …</option>${t.choices.map((c,ci)=>`<option value="${ci}" ${sel===ci?"selected":""}>${esc(c)}</option>`).join("")}</select></label>`;
  }).join("")}</div>
  <div class="row"><button class="btn" data-act="assign" data-key="${key}" ${dis?"disabled":""}>Prüfen</button></div>`;
}
function hintsHTML(t,s,key){
  if(!t.hints?.length || s?.solved) return "";
  const shown=s?.hints||0;
  return `<div class="hints">${t.hints.slice(0,shown).map((h,i)=>`<p class="tip"><b>Tipp ${i+1}:</b> ${esc(h)}</p>`).join("")}
    ${shown<t.hints.length?`<button class="link" data-act="hint" data-key="${key}">${shown?"Noch ein Tipp":"Tipp anzeigen"}</button>`:""}</div>`;
}
function feedbackHTML(t,s,isJump){
  if(!s) return "";
  if(s.solved) return `<div class="fb ok"><b>${s.tries===1?"Richtig, gleich beim ersten Versuch.":"Richtig."}</b> ${esc(t.explain||"")}</div>`;
  if(s.tries>0 && !isJump){
    if(t.type==="assign"){ const r=t.items.filter((it,i)=>s.sel?.[i]===it.answer).length; return `<div class="fb bad">${r} von ${t.items.length} richtig. Die rot markierten passen noch nicht.</div>`; }
    return `<div class="fb bad">Noch nicht. Lies die Frage noch einmal genau${t.hints?.length?" oder hol dir einen Tipp":""}.</div>`;
  }
  return "";
}
function openHTML(t,s,key){
  const sub = s?.submitted; const min=t.minChars||60;
  let h = `<label class="visually-hidden" for="o-${key}">Deine Antwort</label>
    <textarea id="o-${key}" data-key="${key}" placeholder="Schreib deine Antwort hier …">${esc(s?.text||"")}</textarea>
    <p class="hint" id="c-${key}">${(s?.text||"").length} Zeichen${sub?"":`, mindestens ${min}`}</p>`;
  if(!sub) return h + `<div class="row"><button class="btn primary" data-act="submit" data-key="${key}">Antwort abgeben</button></div>`;
  h += `<div class="crit"><p>Prüf deine Antwort selbst: Was davon hast du geschafft?</p>${t.criteria.map((c,ci)=>
      `<label><input type="checkbox" data-act="crit" data-key="${key}" data-c="${ci}" ${s.checks?.[ci]?"checked":""}><span>${esc(c)}</span></label>`).join("")}</div>
    <details><summary>Musterlösung ansehen</summary><p class="sample">${esc(t.sample||"")}</p></details>
    <p class="hint">Du kannst deine Antwort jederzeit überarbeiten.</p>`;
  return h;
}
function taskHTML(t,s,key,num,locked,isJump){
  const body = t.type==="mc"?mcHTML(t,s,key,locked):t.type==="num"?numHTML(t,s,key,locked):t.type==="assign"?assignHTML(t,s,key,locked):openHTML(t,s,key);
  return `<article class="task">
    <p class="k">${isJump?"Sprungaufgabe":"Aufgabe "+num}</p>
    <p class="q">${esc(t.q)}</p>
    ${t.svg?`<div class="fig">${t.svg}</div>`:""}

    ${t.type!=="open"?feedbackHTML(t,s,isJump):""}

}

  const answered = s && (s.solved || s.tries>0);
  return `<div class="lvlhead" style="--c:${col(li)}"><h2>Einstufung ${p.idx+1} von ${pl.length}</h2><p>Eine Frage aus Stufe ${li+1}: ${esc(lvs[li].name)}. Du hast einen Versuch.</p></div>
    ${taskHTML(t,s,"place",0,answered,true)}
    ${answered && !s.solved?`<div class="fb bad">Nicht ganz. Diese Stufe lohnt sich also noch für dich.</div>`:""}
    ${answered?`<div class="row"><button class="btn primary" data-act="placenext">Weiter</button></div>`:""}`;
}
function viewLevel(){
  const ti=P.topic, li=P.current, lv=T().levels[li], st=lvState(ti,li);
  const [d,n]=levelCount(ti,li); const base = li<F();
  let h=`<div class="lvlhead" style="--c:${col(li)}"><h2>Stufe ${li+1}: ${esc(lv.name)}<span class="badge">${base?"Basis":"Erweiterung"}</span></h2><p>${esc(lv.desc||"")}${base&&T().pages?` Nachlesen: Buch ${esc(T().pages)}.`:""}</p></div>
    <div class="progressbar" style="--c:${col(li)}" aria-label="${d} von ${n} Aufgaben erledigt"><i style="width:${n?d/n*100:0}%"></i></div>`;
  if(st==="skipped") h+=`<div class="fb ok" style="margin:0 0 16px">Diese Stufe hast du mit der Sprungaufgabe übersprungen. Du kannst sie trotzdem bearbeiten oder <button class="link" data-act="next">gleich weitergehen</button>.</div>`;
  if(P.jump && lv.jump){
    const k=`${ti}-${li}-jump`; const s=P.tasks[k]; const answered = s && (s.solved||s.tries>0);
    h+=taskHTML(lv.jump,s,k,0,answered,true);
    if(answered){
      h+= s.solved ? `<div class="row"><button class="btn primary" data-act="next">Zur nächsten Stufe</button></div>`
                   : `<div class="fb info">Diese Stufe lohnt sich für dich. Los geht's mit den Aufgaben.</div><div class="row"><button class="btn primary" data-act="unjump">Aufgaben bearbeiten</button></div>`;
    } else h+=`<div class="row"><button class="link" data-act="unjump">Doch lieber die Aufgaben</button></div>`;
    return h;
  }
  if(lv.jump && !st && d===0 && !P.tasks[`${ti}-${li}-jump`])
    h+=`<div class="jump"><p>Kannst du das schon? Löse eine einzige Aufgabe richtig und spring eine Stufe höher.</p><button class="btn" data-act="jump">Sprungaufgabe</button></div>`;
  lv.tasks.forEach((t,k)=>{ h+=taskHTML(t,P.tasks[`${ti}-${li}-${k}`],`${ti}-${li}-${k}`,k+1,false,false); });
  const last = li===T().levels.length-1;
  if(st==="done"){
    const msg = li===F()-1 ? "Stufe geschafft. Damit hast du die Basis dieses Themas erreicht." : "Stufe geschafft.";
    h+=`${burstHTML()}<div class="fb ok">${msg}</div><div class="row">${last?`<button class="btn primary" data-act="nexttopic">${P.topic<content.topics.length-1?"Zum nächsten Thema":"Fortschritt ansehen"}</button>`:`<button class="btn primary" data-act="next">Zu Stufe ${li+2}</button>`}${li===F()-1&&!last?`<button class="btn" data-act="nexttopic">Erst die Basis im nächsten Thema</button>`:""}</div>`;
  }
  else h+=`<div class="row"><button class="btn primary" data-act="finish" ${d<n?"disabled":""}>Stufe abschließen</button>${d<n?`<span class="hint" style="margin:0">Noch ${n-d} ${n-d===1?"Aufgabe":"Aufgaben"} offen</span>`:""}</div>`;
  return h;
}
let celebrate=false;
function burstHTML(){
  if(!celebrate) return "";
  const cs=["--s1","--s2","--s3","--s4","--s5","--s6"]; let s="";
  for(let i=0;i<18;i++){ const x=Math.round((Math.random()*2-1)*220), y=Math.round(-40-Math.random()*120), r=Math.round(Math.random()*540);
    s+=`<i style="left:${10+Math.random()*60}%;background:var(${cs[i%6]});--x:${x}px;--y:${y}px;--r:${r}deg;animation-delay:${(i%6)*20}ms"></i>`; }
  return `<div class="burst" aria-hidden="true">${s}</div>`;
}
function statusText(ti,li){
  const st=lvState(ti,li); const [d,n]=levelCount(ti,li);
  return st==="done"?"geschafft":st==="skipped"?"übersprungen":d>0?`${d} von ${n} Aufgaben`:"noch offen";
}
function reportText(){
  const date=new Date().toLocaleDateString("de-AT");
  let r=`${content.title}: Bloom-Treppe\nStand: ${date}\n`;
  content.topics.forEach((tp,ti)=>{
    r+=`\n== ${tp.name} (${fundDone(ti)?"Basis geschafft":"Basis offen"}) ==\n`;
    tp.levels.forEach((lv,li)=>{
      r+=`Stufe ${li+1} ${lv.name}: ${statusText(ti,li)}\n`;
      lv.tasks.forEach((t,k)=>{ const s=P.tasks[`${ti}-${li}-${k}`];
        if(t.type==="open" && s?.submitted){
          const c=(s.checks||[]).filter(Boolean).length;
          r+=`  Aufgabe ${k+1}: ${t.q.split("\n")[0]}\n  Meine Antwort: ${s.text.replace(/\n/g,"\n  ")}\n  Selbstcheck: ${c} von ${t.criteria.length} Kriterien erfüllt\n`;
        }});
    });
  });
  return r.trim();
}
function viewSummary(){
  return `<h2 class="plain">Mein Fortschritt</h2>
  ${content.topics.map((tp,ti)=>`<h3 style="margin-top:20px">${esc(tp.name)} <span class="badge">${fundDone(ti)?"Basis geschafft":"Basis offen"}</span></h3>
  <ul class="sumlist">${tp.levels.map((lv,i)=>{const st=lvState(ti,i);
    return `<li><span class="dot ${st?"full":""}" style="--c:${col(i)}"></span><button class="link" data-act="goto" data-t="${ti}" data-i="${i}">Stufe ${i+1}: ${esc(lv.name)}</button><span class="s">${statusText(ti,i)}</span></li>`}).join("")}</ul>`).join("")}
  <h3>Lernnachweis für dein Portfolio</h3>
  <p class="hint" style="margin:0 0 8px">Enthält deinen Stand in allen Themen, deine Antworten auf die offenen Aufgaben und deinen Selbstcheck.</p>
  <textarea id="report" readonly>${esc(reportText())}</textarea>
  <div class="row"><button class="btn primary" data-act="copy">Text kopieren</button><span class="hint" id="copied" style="margin:0"></span></div>
  <div class="row" style="margin-top:28px"><button class="btn" data-act="reset">Fortschritt zurücksetzen</button></div>`;
}
function viewTeacher(){
  return `<div class="teacher"><h2 class="plain">Für Lehrkräfte</h2>
  <p><b>Fundamentum und Additum.</b> Jedes Thema des Kapitels ist eine Treppe nach Blooms Lernzieltaxonomie. Die Stufen 1 bis ${F()} bilden das Fundamentum, das alle erreichen sollen. Sie folgen eng dem Foliensatz, verweisen auf die Buchseiten und bieten gestufte Tipps. Ab Stufe ${F()+1} beginnt das Additum: offene Aufgaben zum Analysieren, Bewerten und Erschaffen, die mit Kriterien selbst eingeschätzt werden.</p>
  <p><b>Differenzierung in beide Richtungen.</b> Wer Unterstützung braucht, holt sich Tipps und kann die Basis Schritt für Schritt erarbeiten. Wer die Grundlagen bereits beherrscht, beweist das mit einer Sprungaufgabe oder der Einstufung und arbeitet sofort auf höheren Denkstufen (Compacting). Lernende können nach der Basis auch erst ins nächste Thema wechseln. Die Antwortreihenfolge wird pro Aufgabe gemischt.</p>
  <p><b>Die Farben</b> der Stufen folgen der Skala des Universalindikators, von rot bis violett.</p>
  <h3 style="margin-top:24px">Inhalte anpassen</h3>
  <p>Der gesamte Inhalt steckt in der Struktur unten: <code>topics</code> mit je bis zu sechs <code>levels</code>; <code>fundamentum</code> legt fest, wie viele Stufen zur Basis gehören. Aufgabentypen: <code>mc</code> (Auswahl, <code>correct</code> zählt ab 0), <code>num</code> (Zahl mit Toleranz <code>tol</code>), <code>assign</code> (Teilchen einer Gleichung <code>eq</code> den <code>choices</code> zuordnen), <code>open</code> (mit <code>criteria</code> und <code>sample</code>). Optional: <code>hints</code> für gestufte Tipps, <code>jump</code> pro Stufe für Sprungaufgabe und Einstufung. Eigene Inhalte werden nur in diesem Browser gespeichert.</p>
  <label class="visually-hidden" for="json">Inhalt als JSON</label>
  <textarea id="json" spellcheck="false">${esc(JSON.stringify(content,null,2))}</textarea>
  ${teacherMsg?`<div class="fb ${teacherMsg.ok?"ok":"bad"}">${esc(teacherMsg.text)}</div>`:""}
  <div class="row"><button class="btn primary" data-act="applyjson">Inhalt übernehmen</button><button class="btn" data-act="defaultjson">Originalinhalt wiederherstellen</button></div>
  <p class="hint">Beim Übernehmen wird der Fortschritt in diesem Browser zurückgesetzt.</p></div>`;
}

function render(){
  document.getElementById("title").textContent = content.title;
  document.getElementById("subtitle").textContent = content.subtitle||"";
  document.title = content.title+": Bloom-Treppe";
  renderTabs(); renderStairs();
  const v=P.view; const panel=document.getElementById("panel");
  panel.innerHTML = v==="level"?viewLevel():v==="placement"?viewPlacement():v==="summary"?viewSummary():v==="teacher"?viewTeacher():viewStart();
  panel.querySelectorAll(".fb").forEach(el=>{ const k=el.classList.contains("ok")?"✓":el.classList.contains("bad")?"✕":"i"; el.innerHTML=`<span class="ico" aria-hidden="true">${k}</span><div>${el.innerHTML}</div>`; });
  const navView = v==="summary"?"summary":v==="teacher"?"teacher":"home";
  document.querySelectorAll("[data-nav]").forEach(b=>{ if(b.dataset.nav===navView) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  document.getElementById("hero").classList.toggle("compact", v!=="start");
  celebrate=false;
  persist();
}
function go(view,extra,scrollTo){
  Object.assign(P,{view},extra||{}); render();
  const el=document.getElementById(scrollTo||"panel"); const r=el.getBoundingClientRect();
  if(scrollTo || r.top<70 || r.top>innerHeight*0.6) el.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}

/* ---------- Logik ---------- */
const isOneShot = key => key==="place" || key.endsWith("-jump");
function getTask(key){
  if(key==="place"){ const li=placementLevels(P.topic)[P.placement.idx]; return T().levels[li].jump; }
  const [ti,li,k]=key.split("-"); const lv=content.topics[+ti].levels[+li];
  return k==="jump"?lv.jump:lv.tasks[+k];
}
function getState(key){ if(key==="place") return P.placementAns||(P.placementAns={tries:0,wrong:[]}); return P.tasks[key]||(P.tasks[key]={tries:0,wrong:[]}); }
function afterAnswer(key,correct){
  if(key==="place"){ if(correct){ const li=placementLevels(P.topic)[P.placement.idx]; P.levels[`${P.topic}-${li}`]="skipped"; } P.placement.last=correct; return; }
  const [ti,li,k]=key.split("-");
  if(k==="jump" && correct) P.levels[`${ti}-${li}`]="skipped";
}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b || b.tagName==="SELECT") return;
  const a=b.dataset.act, key=b.dataset.key;
  if(a==="home") return go("start");
  if(a==="summary") return go("summary");
  if(a==="teacher"){ teacherMsg=null; return go("teacher"); }
  if(a==="topic"){ const fromCard=b.classList.contains("tcard"); return go("start",{topic:+b.dataset.t,jump:false,placement:{idx:0,last:null},placementAns:null},fromCard?"tabs":null); }
  if(a==="goto") return go("level",{topic:+b.dataset.t,current:+b.dataset.i,jump:false});
  if(a==="level") return go("level",{current:+b.dataset.i,jump:false});
  if(a==="next"){ const n=P.current+1; return n<T().levels.length?go("level",{current:n,jump:false}):go("summary"); }
  if(a==="nexttopic"){ const n=P.topic+1; return n<content.topics.length?go("start",{topic:n,jump:false,placement:{idx:0,last:null},placementAns:null},"tabs"):go("summary"); }
  if(a==="jump"){ P.jump=true; return render(); }
  if(a==="unjump"){ P.jump=false; return render(); }
  if(a==="hint"){ const s=getState(key); s.hints=(s.hints||0)+1; return render(); }
  if(a==="placement"){ placementLevels(P.topic).forEach(i=>{ if(lvState(P.topic,i)==="skipped") delete P.levels[`${P.topic}-${i}`]; }); P.placement={idx:0,last:null}; P.placementAns=null; return go("placement"); }
  if(a==="placenext"){ if(P.placement.last){ P.placement.idx++; P.placement.last=null; } else P.placement.done=true; P.placementAns=null; return render(); }
  if(a==="mc"){
    const t=getTask(key), s=getState(key), o=+b.dataset.o; s.tries++;
    if(o===t.correct){ s.solved=true; afterAnswer(key,true); }
    else { s.wrong.push(o); if(isOneShot(key)) afterAnswer(key,false); }
    return render();
  }
  if(a==="num"){
    const t=getTask(key), s=getState(key); const inp=document.getElementById("n-"+key);
    const raw=inp.value.trim().replace(/\s/g,"").replace("−","-").replace(",","."); const v=Number(raw);
    if(raw===""||isNaN(v)){ inp.focus(); return; }
    s.value=inp.value; s.tries++;
    if(Math.abs(v-t.answer)<=(t.tol??0.01)+1e-12){ s.solved=true; afterAnswer(key,true); }
    else if(isOneShot(key)) afterAnswer(key,false);
    return render();
  }
  if(a==="assign"){
    const t=getTask(key), s=getState(key); s.sel=s.sel||[];
    if(t.items.some((_,i)=>s.sel[i]===undefined||s.sel[i]===null)){ const f=document.querySelector(`select[data-key="${key}"]:not([disabled])`); const empty=[...document.querySelectorAll(`select[data-key="${key}"]`)].find(x=>x.value===""); (empty||f)?.focus(); return; }
    s.tries++; s.checked=true;
    const ok=t.items.every((it,i)=>s.sel[i]===it.answer);
    if(ok){ s.solved=true; afterAnswer(key,true); } else if(isOneShot(key)) afterAnswer(key,false);
    return render();
  }
  if(a==="submit"){
    const t=getTask(key), s=getState(key); const ta=document.getElementById("o-"+key);
    s.text=ta.value; const min=t.minChars||60;
    if(s.text.trim().length<min){ document.getElementById("c-"+key).textContent=`${s.text.length} Zeichen. Schreib noch etwas mehr (mindestens ${min}).`; ta.focus(); persist(); return; }
    s.submitted=true; s.checks=s.checks||[]; return render();
  }
  if(a==="finish"){ P.levels[`${P.topic}-${P.current}`]="done"; celebrate=true; return render(); }
  if(a==="copy"){
    const ta=document.getElementById("report"); const msg=document.getElementById("copied");
    const fallback=()=>{ ta.focus(); ta.select(); try{ document.execCommand("copy"); msg.textContent="Kopiert."; }catch(err){ msg.textContent="Text ist markiert: mit Strg+C kopieren."; } };
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(ta.value).then(()=>msg.textContent="Kopiert.",fallback); else fallback();
    return;
  }
  if(a==="reset"){
    if(b.dataset.armed){ P=freshProgress(); return go("start"); }
    b.dataset.armed="1"; b.textContent="Wirklich alles zurücksetzen? Nochmals klicken"; return;
  }
  if(a==="applyjson"){
    try{
      const c=JSON.parse(document.getElementById("json").value);
      if(!c.title||!Array.isArray(c.topics)||!c.topics.length) throw new Error("Es braucht einen Titel und mindestens ein Thema in topics.");
      c.topics.forEach((tp,ti)=>{
        if(!tp.name||!Array.isArray(tp.levels)||!tp.levels.length||tp.levels.length>6) throw new Error(`Thema ${ti+1} braucht einen Namen und 1 bis 6 Stufen.`);
        tp.levels.forEach((lv,i)=>{ const where=`Thema ${ti+1}, Stufe ${i+1}`;
          if(!lv.name||!Array.isArray(lv.tasks)||!lv.tasks.length) throw new Error(`${where} braucht einen Namen und mindestens eine Aufgabe.`);
          [...lv.tasks,...(lv.jump?[lv.jump]:[])].forEach((t,k)=>{ const w=`${where}, Aufgabe ${k+1}`;
            if(!["mc","num","open","assign"].includes(t.type)||!t.q) throw new Error(`${w}: Typ (mc, num, assign oder open) und Frage q fehlen.`);
            if(t.type==="mc"&&(!Array.isArray(t.options)||typeof t.correct!=="number")) throw new Error(`${w}: options und correct fehlen.`);
            if(t.type==="num"&&typeof t.answer!=="number") throw new Error(`${w}: answer muss eine Zahl sein.`);
            if(t.type==="assign"&&(!Array.isArray(t.items)||!Array.isArray(t.choices))) throw new Error(`${w}: items und choices fehlen.`);
            if(t.type==="open"&&!Array.isArray(t.criteria)) throw new Error(`${w}: criteria fehlen.`);
          }); });
      });
      content=c; save(KEY_C,c); P=Object.assign(freshProgress(),{view:"teacher"}); teacherMsg={ok:true,text:"Übernommen. Die Treppen zeigen jetzt deine Inhalte."};
    }catch(err){ teacherMsg={ok:false,text:"Nicht übernommen: "+(err instanceof SyntaxError?"Die Struktur ist kein gültiges JSON (oft fehlt ein Komma oder eine Klammer).":err.message)}; }
    return render();
  }
  if(a==="defaultjson"){ content=DEFAULT_CONTENT; try{localStorage.removeItem(KEY_C)}catch(e){} P=Object.assign(freshProgress(),{view:"teacher"}); teacherMsg={ok:true,text:"Originalinhalt wiederhergestellt."}; return render(); }
});
document.addEventListener("change",e=>{
  const c=e.target.closest('[data-act="crit"]');
  if(c){ const s=getState(c.dataset.key); s.checks=s.checks||[]; s.checks[+c.dataset.c]=c.checked; persist(); return; }
  const sel=e.target.closest('select[data-act="sel"]');
  if(sel){ const s=getState(sel.dataset.key); s.sel=s.sel||[]; s.sel[+sel.dataset.i]=sel.value===""?null:+sel.value; s.checked=false;
    sel.closest("label").classList.remove("wrong","right"); persist(); }
});
document.addEventListener("input",e=>{
  const ta=e.target; if(ta.tagName!=="TEXTAREA"||!ta.dataset.key) return;
  const s=getState(ta.dataset.key); s.text=ta.value; const t=getTask(ta.dataset.key);
  const h=document.getElementById("c-"+ta.dataset.key); if(h) h.textContent=`${ta.value.length} Zeichen${s.submitted?"":`, mindestens ${t.minChars||60}`}`;
  persist();
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter" && e.target.matches?.(".numrow input")){ e.preventDefault(); e.target.parentElement.querySelector('[data-act="num"]').click(); }
});
if(!content.topics?.[P.topic] || (P.view==="level" && !T().levels[P.current])) P=freshProgress();
render();

</script>
</body>
</html>
